<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迷你 CAD｜3D 建模</title>
<style>
:root{--bg:#f3f5f8;--pn:#fff;--tx:#1d2733;--mu:#6b7785;--bd:#d3dae4;--ac:#1a73e8;--hv:#e6effd;--v1:#eef2f7;--v2:#c5cfdc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--pn:#1b2129;--tx:#e6ebf1;--mu:#8b97a5;--bd:#2f3844;--ac:#6aa6ff;--hv:#243247;--v1:#2c3542;--v2:#12171d}}
:root[data-theme="dark"]{--bg:#12161c;--pn:#1b2129;--tx:#e6ebf1;--mu:#8b97a5;--bd:#2f3844;--ac:#6aa6ff;--hv:#243247;--v1:#2c3542;--v2:#12171d}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
#app{display:grid;height:100%;grid-template:"t" auto "v" 1fr "s" minmax(0,38%)/minmax(0,1fr)}
#bar{grid-area:t;display:flex;gap:6px;padding:6px;flex-wrap:wrap;background:var(--pn);border-bottom:1px solid var(--bd);align-items:center}
#bar button{flex:1 1 0;max-width:120px;min-width:0;padding:0 4px}
#bar button.op{background:var(--hv);border-color:var(--ac);color:var(--ac)}
button,select{flex:none;height:32px;padding:0 9px;border:1px solid var(--bd);border-radius:7px;background:var(--pn);color:var(--tx);font:inherit;white-space:nowrap}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
#vp{grid-area:v;position:relative;min-height:0;background:linear-gradient(var(--v1),var(--v2));--gb:112px;--gr:36px;--gh:112px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:8px;top:8px;right:var(--gh);pointer-events:none;color:var(--mu);font-size:12px}
#gz{inset:auto;top:8px;right:8px;width:96px;height:96px;cursor:pointer}
#side{grid-area:s;display:grid;grid-template-columns:1fr 1fr;min-height:0;border-top:1px solid var(--bd)}
#tree,#props{overflow:auto;padding:8px;background:var(--pn);min-height:0}
#tree{border-right:1px solid var(--bd)}
h4{margin:0 0 6px;font-size:12px;color:var(--mu);font-weight:600}
.it{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer}
.it.on{background:var(--hv);color:var(--ac)}
.pl{color:var(--mu)}
label{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:4px 0}
input[type=number]{width:90px;height:30px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);padding:0 6px;font:inherit}
input[type=text]{width:120px;height:30px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);padding:0 6px;font:inherit}input[type=text].rn{width:100%;height:24px;box-sizing:border-box}#as{margin-left:auto;align-self:center;font-size:12px;opacity:.7;padding:0 8px;white-space:nowrap}
input[type=color]{width:90px;height:30px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
.mu{color:var(--mu)}
#mass{margin-top:8px;padding-top:6px;border-top:1px dashed var(--bd)}
#del,#zup{margin-top:6px;width:100%}
#mn{position:fixed;z-index:20;min-width:200px;max-width:calc(100vw - 12px);max-height:70vh;overflow:auto;padding:4px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#mn button{display:block;width:100%;height:42px;text-align:left;border:0;background:none}
#mn button:active{background:var(--hv)}
#mn button.on{background:var(--hv);color:var(--ac)}
#mn button.tg.on::after{content:"✓";float:right}
#mn label{margin:0;padding:4px 10px}
#mn h4{margin:6px 10px 2px}
#mn button:disabled{opacity:.4}
#sh{display:none;position:fixed;z-index:30;top:calc(8px + env(safe-area-inset-top,0px));right:8px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.hu #sh{display:block;left:8px;right:auto}
.hu #bar,.hu #side,.hu #hint{display:none}
.hu #app{grid-template:"v" 1fr/minmax(0,1fr)}
@media(min-width:800px){#app{grid-template:"t t t" auto "f v p" 1fr/210px minmax(0,1fr) 270px}#side{display:contents}#tree{grid-area:f;border-top:0}#props{grid-area:p;border-left:1px solid var(--bd)}}
#lbtn{position:absolute;top:var(--gb);right:var(--gr);width:40px;height:40px;padding:0;border-radius:50%;font-size:20px;line-height:1;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#mvbtn,#rtbtn{position:absolute;top:calc(var(--gb) + 46px);right:var(--gr);width:40px;height:40px;padding:0;border-radius:50%;font-size:22px;line-height:1;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#rtbtn{top:calc(var(--gb) + 92px)}
#lp{position:absolute;z-index:3;left:8px;bottom:8px;width:min(340px,calc(100% - 16px));padding:8px 10px;background:var(--pn);background:color-mix(in srgb,var(--pn) 94%,transparent);border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#lp[hidden]{display:none}
#lh{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#lt{display:flex;gap:4px;flex:1;min-width:0}
#lt button,#lx{height:28px;padding:0 6px}
#lt button{flex:1 1 0;min-width:0}
#lt i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;border:1px solid var(--mu)}
#lx{width:28px;padding:0}
#lp .r{display:flex;align-items:center;gap:8px;margin:4px 0;min-height:28px}
#lp .r label{display:flex;align-items:center;gap:6px;margin:0}
#lp .ln{flex:none;width:56px;color:var(--mu)}
#lp input[type=range]{flex:1;min-width:0;height:28px;margin:0;accent-color:var(--ac)}
#lp input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--ac)}
#lp output{flex:none;width:44px;text-align:right;font-variant-numeric:tabular-nums}
#lp .sw{display:flex;gap:6px;flex:1;min-width:0}
#lp .sw button{width:24px;height:24px;padding:0;border-radius:50%;border:1px solid var(--bd)}
#lp input[type=color]{width:40px;height:28px;flex:none}
#lp .g{margin-left:auto;height:28px;font-size:12px;color:var(--mu)}
.bo{display:flex;gap:6px;margin-bottom:6px}.bo button{flex:1;padding:0 4px}
.hu #lbtn,.hu #mvbtn,.hu #rtbtn,.hu #lp{display:none}
#props input[type=range]{width:90px;accent-color:var(--ac)}#props select{max-width:100px}
#props select[data-k=mat]{width:150px;max-width:150px;text-overflow:ellipsis}.mnote{font-size:12px;margin:-2px 0 6px}
/* 分類工具列：第二行顯示所選分類的按鈕，超出寬度時可左右捲動 */
#bar #mn{position:static;order:9;flex:1 0 100%;min-width:0;max-width:none;max-height:none;padding:6px 0 2px;border:0;border-top:1px dashed var(--bd);border-radius:0;box-shadow:none;background:none;display:flex;flex-wrap:nowrap;gap:12px;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
#bar #mn[hidden],#bar #mn>div[hidden]{display:none}
#bar #mn>div{display:flex;gap:6px;align-items:center;flex:none}
#bar #mn button{flex:none;width:auto;max-width:none;height:32px;padding:0 10px;text-align:center;border:1px solid var(--bd);border-radius:7px;background:var(--pn)}
#bar #mn button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#bar #mn button.tg.on::after{content:none}
#bar #mn h4{margin:0 0 0 4px;flex:none;white-space:nowrap}
#bar #mn label{margin:0;padding:0 2px;white-space:nowrap}
#acn,#asp{width:64px}
/* 設定面板與背景影片 */
#bgv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bgv[hidden]{display:none}
#sp{position:fixed;z-index:40;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 16px));max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);overflow:auto;padding:8px 10px 10px;background:var(--pn);background:color-mix(in srgb,var(--pn) 96%,transparent);border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#sp[hidden],.hu #sp,#sp [hidden]{display:none!important}
#sp .hd{display:flex;align-items:center;justify-content:space-between;font-weight:600}
#sp .hd button{width:28px;height:28px;padding:0}
#sp h4{margin:10px 0 4px}
#sp .r{display:flex;align-items:center;gap:8px;margin:4px 0;min-height:28px}
#sp .r label{display:flex;align-items:center;gap:6px;margin:0}
#sp .ln{flex:none;width:56px;color:var(--mu)}
#sp input[type=range]{flex:1;min-width:0;height:28px;margin:0;accent-color:var(--ac)}
#sp input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--ac)}
#sp output{flex:none;width:44px;text-align:right;font-variant-numeric:tabular-nums}
#sp select{flex:1;min-width:0}
#sp .sg{display:flex;gap:4px;margin:4px 0 6px}
#sp .sg button{flex:1 1 0;min-width:0;padding:0 4px}
#sp .sw{display:flex;gap:6px;flex:1;min-width:0}
#sp .sw button{width:24px;height:24px;padding:0;border-radius:50%}
#sp .sw button[aria-pressed=true]{outline:2px solid var(--ac);outline-offset:1px}
#sp input[type=color]{width:40px;height:28px;flex:none}
#sp .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}
#sp .nt{margin:2px 0 0;font-size:12px;color:var(--mu)}
#sp .rs{width:100%;margin-top:10px}
#sp input:disabled{opacity:.4}
#sp button:focus-visible,#sp input:focus-visible,#sp select:focus-visible,#stb:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
</style>
</head>
<body>
<div id="app">
<div id="bar">
<button data-m="add">新增</button><button data-m="ed">編輯</button><button data-m="sk">草圖</button><button data-m="vw">視角</button><button data-m="ds">顯示</button><button data-m="pj">專案</button><button id="stb" aria-haspopup="dialog" aria-expanded="false">設定</button><span id="as"></span>
</div>
<div id="vp"><video id="bgv" muted loop autoplay playsinline hidden></video><canvas id="cv"></canvas><div id="hint"></div><canvas id="gz"></canvas><button id="lbtn" aria-label="燈光" title="燈光">💡</button><button id="mvbtn" aria-label="移動模式" title="移動模式">✥</button><button id="rtbtn" aria-label="旋轉模式" title="旋轉模式">⟳</button><div id="lp" hidden><div id="lh"><div id="lt"></div><button id="lx" aria-label="關閉">✕</button></div><div id="lb"></div></div></div>
<div id="side"><div id="tree"></div><div id="props"></div></div>
</div>
<button id="sh">顯示</button><input id="fi" type="file" hidden><input id="ti" type="file" accept="image/*" hidden>
<div id="sp" role="dialog" aria-label="設定" hidden>
<div class="hd"><span>設定</span><button id="sx" aria-label="關閉">✕</button></div>
<h4>右上角 3D 座標軸</h4>
<div class="r"><label><input type="checkbox" id="gon" checked>顯示座標軸</label></div>
<div class="r"><span class="ln">透明度</span><input type="range" id="gop" min="10" max="100" step="5" value="100"><output id="gov">100%</output></div>
<div class="r"><span class="ln">大小</span><input type="range" id="gsz" min="60" max="160" step="4" value="96"><output id="gsv">96</output></div>
<h4>建模背景</h4>
<div class="sg"><button data-bm="def">預設</button><button data-bm="color">純色</button><button data-bm="image">圖片</button><button data-bm="video">影片</button></div>
<div class="r" data-bp="color"><span class="ln">顏色</span><span class="sw" id="bsw"></span><input type="color" id="bcl" value="#dfe6ee" aria-label="自訂背景顏色"></div>
<div class="r" data-bp="image"><button id="bpi">選擇圖片…</button><span class="fn" id="bin"></span></div>
<div class="r" data-bp="video"><button id="bpv">選擇影片…</button><span class="fn" id="bvn"></span></div>
<div class="r" data-bp="image video"><span class="ln">顯示方式</span><select id="bfit"><option value="cover">填滿（裁切邊緣）</option><option value="contain">完整顯示</option></select></div>
<div class="nt" data-bp="video">影片會靜音並重複播放；重新整理後需重新選擇影片。</div>
<button id="sr" class="rs">全部還原預設</button>
</div>
<input id="bfi" type="file" accept="image/*" hidden><input id="bfv" type="file" accept="video/*" hidden>
<div id="mn" hidden>
<div data-g="add"><h4>基本體</h4><button data-a="box">▣ 方塊</button><button data-a="cyl">⬭ 圓柱</button><button data-a="sph">● 球體</button><button data-a="cone">▲ 圓錐</button><h4>進階體</h4><button data-a="tor">◎ 圓環（Torus）</button><button data-a="pyr">△ 角錐</button><button data-a="pip">◯ 管狀體（Pipe）</button><h4>正多面體</h4><label>種類<select id="py"><option value="4">正四面體</option><option value="6">正六面體</option><option value="8">正八面體</option><option value="12">正十二面體</option><option value="20">正二十面體</option></select></label><button data-a="ply">⬡ 新增正多面體</button><h4>貼圖</h4><button id="tx">🖼 匯入貼圖（套用到所選特徵）</button></div>
<div data-g="ed" hidden><button id="ud" class="tg">↶ 復原</button><button id="rd" class="tg">↷ 重做</button><button id="mvm">✥ 移動模式（拖曳 XYZ 箭頭）</button><button id="rtm">⟳ 旋轉模式（拖曳 XYZ 圓環）</button><button id="dp">⧉ 複製所選特徵 (Ctrl+D)</button><button id="rn">✎ 重新命名所選特徵 (F2)</button><button id="bu2">⊕ 聯集（先選主體，再點選另一特徵）</button><button id="bs2">⊖ 切除（先選主體，再點選刀具）</button><button id="bi2">∩ 交集（先選主體，再點選另一特徵）</button><button id="mir">⇋ 鏡像複製</button><label>鏡像面<select id="mpl"><option value="0">YZ 面（X 反向）</option><option value="1">XZ 面（Y 反向）</option><option value="2">XY 面（Z 反向）</option></select></label><button id="arr">▦ 線性陣列</button><label>軸向<select id="aax"><option value="0">X</option><option value="1">Y</option><option value="2">Z</option></select></label><label>數量<input type="number" id="acn" value="3" min="2" max="20" step="1"></label><label>間距<input type="number" id="asp" value="50" step="1"></label><label>移動吸附<select id="msn"><option value="0.1">0.1 mm</option><option value="1">1 mm</option><option value="5">5 mm</option><option value="10">10 mm</option></select></label></div>
<div data-g="sk" hidden><button id="sk">開始草圖</button><label>基準面<select id="pl"><option value="front">前視基準面</option><option value="top">上視基準面</option><option value="right">右視基準面</option></select></label><label>草圖工具<select id="tl"><option value="r">矩形</option><option value="c">圓形</option></select></label></div>
<div data-g="vw" hidden><button data-v="front">前視圖</button><button data-v="top">上視圖</button><button data-v="right">右視圖</button><button data-v="iso">等角視圖</button><button data-v="fit">縮放至全部</button><button id="tt" class="tg">⟲ 自動旋轉展示</button></div>
<div data-g="ds" hidden><button id="wf" class="tg">線框顯示</button><button id="gd" class="tg on">顯示格線</button><button id="sa">👁 全部顯示特徵</button><button id="ha">🚫 全部隱藏特徵</button><button id="ms">📏 量測距離（M）</button><button id="hd">隱藏介面</button></div>
<div data-g="pj" hidden><button id="im">匯入專案／模型</button><button id="ep">存專案（.json）</button><button id="nw">🗋 新專案（可復原）</button><button id="e3">匯出 STL/OBJ（.zip）</button><button id="shot">📷 截圖（PNG）</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s),cl=(v,a,b)=>Math.min(b,Math.max(a,v)),cv=$('#cv'),vp=$('#vp');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.1,5000);
const HL=new THREE.HemisphereLight(0xffffff,0x667788,.95);S.add(HL);
const DL=new THREE.DirectionalLight(0xffffff,.8);DL.position.set(80,160,120);S.add(DL);
const PT=new THREE.PointLight(0xfff1d6,0,0,1);PT.position.set(60,80,60);S.add(PT);
S.add(new THREE.AxesHelper(50));
const G0=new THREE.GridHelper(300,30,0x7f8ea3,0x7f8ea3);G0.material.transparent=true;G0.material.opacity=.35;S.add(G0);
const SP=new THREE.Group(),SG=new THREE.GridHelper(300,60,0x1a73e8,0x1a73e8);
SG.rotation.x=Math.PI/2;SG.material.transparent=true;SG.material.opacity=.4;
const HP=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshBasicMaterial({visible:false,side:THREE.DoubleSide}));
SP.add(SG,HP);SP.visible=false;S.add(SP);
const grp=new THREE.Group();S.add(grp);

/* 相機（自製軌道控制） */
let th=.8,ph=1,rad=180;const tg=new THREE.Vector3(0,15,0);
function cam(){C.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));C.lookAt(tg);gz()}
function pan(dx,dy){C.updateMatrix();const k=rad*.0017,r=new THREE.Vector3().setFromMatrixColumn(C.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(C.matrix,1);tg.addScaledVector(r,-dx*k).addScaledVector(u,dy*k)}
const VW={front:[0,Math.PI/2],top:[0,.001],right:[Math.PI/2,Math.PI/2],iso:[.8,1]};
function view(k){[th,ph]=VW[k];cam()}
new ResizeObserver(()=>{const w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}).observe(vp);
function loop(){if(tt&&!P.size&&!sk){th-=.006;cam()}mvUpdate();rtUpdate();R.render(S,C);requestAnimationFrame(loop)}/* 於腳本末端啟動 */

/* 特徵資料 */
const NM={box:'方塊',cyl:'圓柱',sph:'球體',cone:'圓錐',ext:'伸長凸台',tor:'圓環',pyr:'角錐',pip:'管狀體',ply:'正多面體',mesh:'匯入網格'},PLN={4:'正四面體',6:'正六面體',8:'正八面體',12:'正十二面體',20:'正二十面體'},IC={box:'▣',cyl:'⬭',sph:'●',cone:'▲',tor:'◎',pyr:'△',pip:'◯',ply:'⬡',ext:'⬒',mesh:'◇'},esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const PAL=[0x8fa8c4,0xc49a6c,0x7fb69e,0xb58fc4,0xd4a5a5,0xa8b86f];
const DEF={box:{w:40,h:30,d:30},cyl:{r:15,h:40},sph:{r:20},cone:{r:20,h:40},tor:{R:25,r:8},pyr:{r:25,h:40,n:4},pip:{r:20,t:4,h:40},ply:{r:25,k:12}};

function setMat(f,k){if(k&&!MAT[k])return;
 const ob=MAT[f.mat];if(ob&&ob.o!=null&&f.o==ob.o)delete f.o;
 if(k){f.mat=k;f.c=MAT[k].c;if(MAT[k].o!=null)f.o=MAT[k].o}else delete f.mat;
 delete f.rho;build(f);ui();push();
 msg(k?`已套用材質：${MAT[k].n}（密度 ${MAT[k].d} g/cm³）`:'已改回預設材質（鋼 7.85 g/cm³）')}

let F=[],sel=null,nid=1,wf=false,sk=false,drag=null,pv=null;

function geo(f){
 const p=f.p,q=k=>Math.max(.1,+p[k]||.1);let g;
 if(f.t=='box'){g=new THREE.BoxGeometry(q('w'),q('h'),q('d'));g.translate(0,q('h')/2,0)}
 else if(f.t=='cyl'){g=new THREE.CylinderGeometry(q('r'),q('r'),q('h'),48);g.translate(0,q('h')/2,0)}
 else if(f.t=='cone'){g=new THREE.CylinderGeometry(0,q('r'),q('h'),48);g.translate(0,q('h')/2,0)}
 else if(f.t=='sph'){g=new THREE.SphereGeometry(q('r'),48,32);g.translate(0,q('r'),0)}
 else if(f.t=='tor'){const R=q('R'),r=q('r');g=new THREE.TorusGeometry(R,r,24,64);g.rotateX(Math.PI/2);g.translate(0,r,0)}
 else if(f.t=='pyr'){const n=cl(Math.round(+p.n||4),3,32),h=q('h');g=new THREE.ConeGeometry(q('r'),h,n,1);g.rotateY(Math.PI/n);g.translate(0,h/2,0);g=g.toNonIndexed();g.computeVertexNormals()}
 else if(f.t=='pip'){const ro=q('r'),t=Math.min(Math.max(.1,+p.t||.1),ro-.1),ri=ro-t,h=q('h');
  g=new THREE.LatheGeometry([[ri,0],[ro,0],[ro,h],[ri,h],[ri,0]].map(a=>new THREE.Vector2(a[0],a[1])),64).toNonIndexed();
  const a=g.attributes.position.array;g.setAttribute('normal',new THREE.BufferAttribute(cNorm(a,a.length),3))}
 else if(f.t=='ply'){const k=[4,6,8,12,20].reduce((a,b)=>Math.abs(b-(+p.k||12))<Math.abs(a-(+p.k||12))?b:a),r=q('r');
  g=k==4?new THREE.TetrahedronGeometry(r):k==6?new THREE.BoxGeometry(2*r/Math.sqrt(3),2*r/Math.sqrt(3),2*r/Math.sqrt(3)):k==8?new THREE.OctahedronGeometry(r):k==12?new THREE.DodecahedronGeometry(r):new THREE.IcosahedronGeometry(r);
  g.translate(0,r,0)}
 else if(f.t=='mesh'){const s=Math.max(1e-4,+p.s||1),n=p.v.length-p.v.length%9,a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=p.v[i]*s;g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));if(p.b)g.setAttribute('normal',new THREE.BufferAttribute(cNorm(p.v,n),3));else g.computeVertexNormals()}
 else{
  const s=new THREE.Shape();
  if(p.k=='r'){s.moveTo(0,0);s.lineTo(q('w'),0);s.lineTo(q('w'),q('h'));s.lineTo(0,q('h'));s.closePath()}
  else s.absarc(0,0,q('r'),0,Math.PI*2,false);
  const d=Math.max(.5,+p.d||.5),m=p.k=='r'?Math.min(q('w'),q('h')):q('r')*2,b=Math.max(0,Math.min(+p.fl||0,d/2-.1,m/2-.1));
  g=new THREE.ExtrudeGeometry(s,{depth:d-2*b,bevelEnabled:b>0,bevelThickness:b,bevelSize:b,bevelOffset:-b,bevelSegments:4,curveSegments:48});
  if(b>0)g.translate(0,0,b);
 }
 return g}
function vol(g){const p=g.attributes.position,ix=g.index,a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),n=ix?ix.count:p.count;let v=0;
 for(let i=0;i<n;i+=3){const t=k=>ix?ix.getX(i+k):i+k;a.fromBufferAttribute(p,t(0));b.fromBufferAttribute(p,t(1));c.fromBufferAttribute(p,t(2));v+=a.dot(b.cross(c))/6}
 return Math.abs(v)}
function hl(f){f.m.material.emissive.set(f.id==sel?0x2a4f86:0)}
function build(f){
 if(f.m){grp.remove(f.m);f.m.geometry.dispose();f.m.material.dispose();f.m.children[0].geometry.dispose()}
 const MR=MAT[f.mat],g=geo(f),m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:f.c,metalness:MR?(ENV?MR.mt:Math.min(MR.mt,.55)):.25,roughness:MR?MR.rg:.5,side:f.t=='mesh'?THREE.DoubleSide:THREE.FrontSide,wireframe:wf,transparent:(f.o||1)<1,opacity:f.o||1,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
 m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,28),new THREE.LineBasicMaterial({color:0x18222e})));
 m.position.fromArray(f.pos);m.rotation.set(f.rot[0],f.rot[1],f.rot[2]||0);m.visible=f.vis;m.userData.id=f.id;if(MR&&ENV){m.material.envMap=ENV;m.material.envMapIntensity=MR.ei}
 if(typeof f.tex=='string'&&f.tex.startsWith('data:image/')){m.material.map=gTex(f);m.material.color.setHex(0xffffff)}else if(MR&&MR.x){wUV(g,MR.s);m.material.map=mTex(MR.x)}

function add(t,p,o={}){const f=Object.assign({id:nid,t,p,pos:[0,0,0],rot:[0,0],c:PAL[(nid-1)%PAL.length],vis:true,name:NM[t]+nid},o);nid++;F.push(f);build(f);select(f.id);push()}

const fm=g=>g>=1000?(g/1000).toFixed(3)+' kg':g.toFixed(1)+' g';
function mass(){const L=F.filter(f=>f.vis);if(!L.length){$('#mass').innerHTML='';return}
 let v=0,w=0;const bb=new THREE.Box3(),by={};
 L.forEach(f=>{const g=f.v/1000*rho(f);v+=f.v;w+=g;bb.expandByObject(f.m);const k=MAT[f.mat]?MAT[f.mat].n:'預設鋼';by[k]=(by[k]||0)+g});
 const z=bb.getSize(new THREE.Vector3()),ks=Object.keys(by),one=ks.length==1&&new Set(L.map(rho)).size==1;
 $('#mass').innerHTML=`<h4>質量特性（${one?esc(ks[0])+' '+(+rho(L[0]).toFixed(3))+' g/cm³':'依各特徵材質／密度'}）</h4>體積 ${(v/1000).toFixed(2)} cm³<br>質量 ${fm(w)}`+(ks.length>1?'<br>'+ks.map(k=>`<span class="mu">${esc(k)}　${fm(by[k])}</span>`).join('<br>'):'')+`<br>外框 ${z.x.toFixed(1)}×${z.y.toFixed(1)}×${z.z.toFixed(1)} mm`}
$('#tree').onclick=e=>{const t=e.target,i=t.closest('[data-id]'),p=t.closest('[data-pl]');

 if(p)startSk(p.dataset.pl);else if(i){const k=+i.dataset.id;bo?bApply(k):select(k)}};
$('#props').oninput=e=>{const f=F.find(x=>x.id==sel),t=e.target,k=t.dataset.k;if(!f||!k)return;
 if(k=='name'){f.name=t.value;const s=$('#tree .it.on span');if(s)s.textContent=IC[f.t]+' '+f.name;return}
 if(k=='c'){f.c=parseInt(t.value.slice(1),16);f.m.material.color.setHex(f.c);return}
 if(k=='o'){f.o=+t.value;f.m.material.transparent=f.o<1;f.m.material.opacity=f.o;f.m.material.needsUpdate=true;return}
 if(k=='mat')return;/* 材質下拉於 change 事件處理，避免 iOS 滾輪選單被重繪中斷 */

 const[a,b]=k.split('.');(a=='pos'?f.pos:f.p)[b]=+t.value||0;build(f);mass()};
$('#props').onclick=e=>{const f=F.find(x=>x.id==sel),i=e.target.id;if(!f)return;
 if(i=='del'){grp.remove(f.m);F=F.filter(x=>x!==f);select(null);push()}
 else if(i=='rtx'){delete f.tex;build(f);ui();push()}
 else if(i=='gnd'){f.m.updateMatrixWorld(true);const y=new THREE.Box3().setFromObject(f.m).min.y;f.pos[1]=+(f.pos[1]-y).toFixed(3);f.m.position.fromArray(f.pos);ui();push()}
 else if(i=='zup'){f.rot[0]=f.rot[0]?0:-Math.PI/2;build(f);mass();push()}
 else if(i=='bu')bStart('u');else if(i=='bs')bStart('s');else if(i=='bi')bStart('i')};
$('#mn').onclick=e=>{const t=e.target.closest('button');if(!t)return;
 if(t.id=='ud')return goto(hi-1);if(t.id=='rd')return goto(hi+1);if(t.id=='dp')return dup();if(t.id=='sa'||t.id=='ha'){const v=t.id=='sa';F.forEach(f=>{f.vis=v;f.m.visible=v});ui();push();return}if(t.id=='nw'){load({F:[]});return msg('已建立新專案（可按復原還原）')}if(t.id=='rn')return sel?ren(sel):msg('請先選取要改名的特徵');if(t.id=='bu2')return bStart('u');if(t.id=='bs2')return bStart('s');if(t.id=='bi2')return bStart('i');
 if(t.dataset.a){endSk();const a=t.dataset.a,p={...DEF[a]},o={};if(a=='ply'){p.k=+$('#py').value;o.name=PLN[p.k]+nid}add(a,p,o);return}

const sn=v=>Math.round(v/5)*5,RC=new THREE.Raycaster(),M=new THREE.Vector2();

function onPl(e){ray(e);const h=RC.intersectObject(HP)[0];if(!h)return null;const q=SP.worldToLocal(h.point.clone());return[sn(q.x),sn(q.y)]}

 else{const r=Math.hypot(b[0]-a[0],b[1]-a[1]);for(let i=0;i<64;i++){const t=i/64*Math.PI*2;pts.push(a[0]+r*Math.cos(t),a[1]+r*Math.sin(t),0)}}

 const wp=SP.localToWorld(new THREE.Vector3(o[0],o[1],0)).toArray(),rot=[SP.rotation.x,SP.rotation.y];

function stl(T){const n=T.length/9,d=new DataView(new ArrayBuffer(84+50*n)),a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();d.setUint32(80,n,true);
 for(let i=0;i<n;i++){const o=84+50*i,t=i*9;a.set(T[t],T[t+1],T[t+2]);b.set(T[t+3],T[t+4],T[t+5]);c.set(T[t+6],T[t+7],T[t+8]);
  const m=b.sub(a).cross(c.sub(a)).normalize();

 $('#bfi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const fr=new FileReader();fr.onerror=()=>msg('無法讀取此圖片');
  fr.onload=()=>{const im=new Image();im.onerror=()=>msg('無法讀取此圖片');
   im.onload=()=>{const k=Math.min(1,1920/Math.max(im.width,im.height)),c=document.createElement('canvas'),x=c.getContext('2d');
    c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    T.b.img=c.toDataURL('image/jpeg',.85);iname=f.name;T.b.mode='image';svImg();bA();ui2();sv();msg('已套用背景圖片：'+f.name)};
   im.src=fr.result};fr.readAsDataURL(f)};
 $('#bfv').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!/^video\//.test(f.type)&&!/\.(mp4|m4v|mov|webm|ogv|ogg|mkv)$/i.test(f.name))return msg('請選擇影片檔');
  if(vurl)URL.revokeObjectURL(vurl);vurl=URL.createObjectURL(f);vname=f.name;bgv.src=vurl;T.b.mode='video';bA();ui2();sv();msg('已套用背景影片：'+f.name+'（靜音・重複播放）')};
 bgv.addEventListener('error',()=>{if(!vurl)return;clrVid();if(T.b.mode=='video')T.b.mode='def';bA();ui2();sv();msg('無法播放此影片，已改回預設背景')});
 $('#stb').onclick=()=>spOpen(sp.hidden);
 $('#lbtn').addEventListener('click',()=>{if(!$('#lp').hidden)spOpen(false)});
 $('#hd').addEventListener('click',()=>spOpen(false));
 addEventListener('keydown',e=>{if(e.key=='Escape'&&!sp.hidden)spOpen(false)});
 /* 啟動：還原上次的設定（資料不合法時忽略） */
 try{const o=JSON.parse(localStorage.getItem(SK))||{},g=o.g||{},b=o.b||{},im=localStorage.getItem(IK);
  if(typeof g.on=='boolean')T.g.on=g.on;
  if(g.op!=null&&Number.isFinite(+g.op))T.g.op=cl(Math.round(+g.op),10,100);
  if(g.sz!=null&&Number.isFinite(+g.sz))T.g.sz=cl(Math.round(+g.sz),60,160);
  if(typeof b.color=='string'&&/^#[0-9a-f]{6}$/i.test(b.color))T.b.color=b.color;
  if(b.fit=='contain')T.b.fit='contain';
  if(typeof im=='string'&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(im))T.b.img=im;
  if(b.mode=='color'||(b.mode=='image'&&T.b.img))T.b.mode=b.mode}catch(_){}
 $('#bsw').innerHTML=CW.map(c=>`<button data-sw="${c}" style="background:${c}" aria-label="背景色 ${c}"></button>`).join('');
 bA();gA();ui2()})();

/* 新增功能：鏡像複製、線性陣列、移動吸附間距、自動旋轉展示 */
let tt=false,msS=.1;
function mirror(){const f=F.find(x=>x.id==sel);if(!f)return msg('請先選取要鏡像的特徵');
 const a=+$('#mpl').value,g=f.m.geometry,p=g.attributes.position,ix=g.index,n=ix?ix.count:p.count,v=new THREE.Vector3(),w=[],T=[];
 f.m.updateMatrixWorld(true);
 for(let i=0;i<n;i++){v.fromBufferAttribute(p,ix?ix.getX(i):i).applyMatrix4(f.m.matrixWorld);w.push(v.x,v.y,v.z)}
 for(let i=0;i<n;i+=3){const t=w.slice(i*3,i*3+9).map((x,j)=>j%3==a?-x:x);T.push(...t.slice(0,3),...t.slice(6,9),...t.slice(3,6))}
 add('mesh',{v:T,s:1,b:1},{name:f.name+' 鏡像',c:f.c,mat:f.mat,rho:f.rho,o:f.o});
 msg('已鏡像複製（鏡像面通過世界原點；結果為網格特徵，可復原）')}
function arr(){const f=F.find(x=>x.id==sel);if(!f)return msg('請先選取要陣列的特徵');
 const a=+$('#aax').value,n=cl(Math.round(+$('#acn').value)||0,2,20),s=+$('#asp').value;if(!s)return msg('間距不可為 0');
 for(let i=1;i<n;i++){const o=f.pos.slice();o[a]=+(o[a]+s*i).toFixed(3);
  const g={id:nid++,t:f.t,p:{...f.p},pos:o,rot:f.rot.slice(),c:f.c,vis:f.vis,name:f.name+' 陣列'+i,o:f.o,tex:f.tex,mat:f.mat,rho:f.rho};F.push(g);build(g)}
 select(f.id);push();msg(`已沿 ${'XYZ'[a]} 軸陣列 ${n} 個（間距 ${s} mm，可一次復原）`)}
$('#mn').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.id=='mir')mirror();else if(t.id=='arr')arr();
 else if(t.id=='tt'){tt=!tt;t.classList.toggle('on',tt);msg(tt?'自動旋轉展示：開啟（拖曳畫面可暫停）':'自動旋轉展示：關閉')}});
$('#msn').onchange=e=>{msS=+e.target.value||.1;msg('移動模式吸附間距：'+msS+' mm')};

/* 自動存檔：變更後 0.4 秒寫入 localStorage，重開頁面自動還原 */
const AK='mini-cad-autosave';let at;
function asv(now){clearTimeout(at);const w=()=>{try{localStorage.setItem(AK,JSON.stringify({v:1,t:Date.now(),F:F.map(({m,v,...r})=>r),L:LD}));$('#as').textContent='已存檔 '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(_){$('#as').textContent='自動存檔失敗'}};now===true?w():at=setTimeout(w,400)}
addEventListener('visibilitychange',()=>{if(document.hidden)asv(true)});addEventListener('pagehide',()=>asv(true));
loop();cam();hint();
let rs=null;try{rs=JSON.parse(localStorage.getItem(AK))}catch(_){}
if(rs&&Array.isArray(rs.F)){load(rs);msg('已還原自動存檔')}else add('box',{...DEF.box});
</script>
